<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEEP COURT 播放器</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="court court-tr"></div>
  <main class="page">
    <p class="kicker"><span class="mark">NBA × AWS BROADCAST CODE 12</span>　·　Team 04　·　DEEP COURT 播放器</p>
    <h1 class="player-title">DEEP COURT <span class="accent">播放器</span></h1>
    <p class="subhead" id="subhead">Team 04 · 打开即看。比分和出手卡来自记分牌与官方逐回合，人名来自球衣号码。</p>
    <nav class="clip-switch" id="clip-switch" aria-label="选择片段"></nav>
    <hr class="rule">

    <div class="replay">
      <div class="player-col">
        <section class="stage" id="stage">
          <video id="reel" playsinline preload="metadata"></video>
          <canvas id="names" aria-hidden="true"></canvas>
        </section>
        <div class="scrub" id="scrub">
          <div class="track"></div>
          <div class="fill" id="fill"></div>
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
      <aside class="rail" aria-label="这一球">
        <p class="rail-kicker">半场落点 · 官方坐标</p>
        <div id="court"></div>
        <div id="detail"></div>
        <p class="script" id="script"></p>
      </aside>
    </div>

    <div class="transport">
      <button class="pause" id="pause" type="button" aria-label="暂停或播放">
        <svg id="pause-icon" width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><rect x="1" y="0" width="3.2" height="14" fill="#14110E"/><rect x="7.6" y="0" width="3.2" height="14" fill="#14110E"/></svg>
      </button>
      <div>
        <div class="clock" id="clock">00:00</div>
        <div class="aside"><span class="teal">◆</span> 解说由程序根据官方事件生成，已混入成片<br><span class="brand">TEAM 04 · DEEP COURT</span></div>
      </div>
    </div>

    <div class="events" id="events"></div>

    <section class="share" aria-labelledby="share-title">
      <h2 id="share-title">分享</h2>
      <div class="share-row">
        <button class="share-btn on" id="share-kuaishou" type="button">
          <img src="brands/kuaishou.svg" alt="" width="28" height="28">
          <span>快手</span>
        </button>
        <button class="share-btn" type="button" disabled>
          <img src="brands/bilibili.svg" alt="" width="28" height="28">
          <span>哔哩哔哩</span>
          <em>即将推出</em>
        </button>
        <button class="share-btn" type="button" disabled>
          <img src="brands/wechat.svg" alt="" width="28" height="28">
          <span>微信</span>
          <em>即将推出</em>
        </button>
        <button class="share-btn" type="button" disabled>
          <img src="brands/weibo.svg" alt="" width="28" height="28">
          <span>微博</span>
          <em>即将推出</em>
        </button>
        <button class="share-btn" type="button" disabled>
          <img src="brands/douyin.svg" alt="" width="28" height="28">
          <span>抖音</span>
          <em>即将推出</em>
        </button>
      </div>
      <iframe id="kuaishou-frame" class="kuaishou-frame" title="快手扫码" hidden></iframe>
    </section>

    <section class="spec">
      <hr class="rule">
      <h2>三层信息</h2>
      <button class="layer on" type="button" data-layer="resident"><b>常驻层</b><span>比分条烧进成片。人名只标票数够的轨迹，跟着框走。</span></button>
      <button class="layer on" type="button" data-layer="event"><b>事件层</b><span>出手后三秒弹出预期命中率、区域和距离。点时间线跳到那一球。</span></button>
      <button class="layer on" type="button" data-layer="expand"><b>展开层</b><span>暂停后写出官方描述、助攻和场上阵容。决策反差只在预期和结果打架时出现。</span></button>
      <p class="baseline">画面上的数字都能在事件清单里对上。没有逐回合来源的引力和胜率摆幅不显示。</p>
    </section>

    <footer class="foot">
      <span id="foot-note">训练片来自组委会发放的火箭、独行侠录像。官方比赛号写在右侧说明里。</span>
      <b>TEAM 04 · 2026.10.09</b>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="replay/clips.js"></script>
  <script src="game.js?v=7"></script>
</body>
</html>
