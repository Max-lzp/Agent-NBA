name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'web/**'
      - 'scripts/build_archive_site.py'
      - 'scripts/package_official_clips.py'
      - 'scripts/package_rulebook.py'
      - 'data/official-rulebook/**'
      - 'scripts/qa/check_official_clips.py'
      - 'scripts/qa/check_rulebook.py'
      - 'scripts/qa/check_archive_replay.py'
      - 'scripts/qa/check_timeline.mjs'
      - 'scripts/qa/check_local_replay.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate timeline data contract
        run: node scripts/qa/check_timeline.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build original competition replay
        run: |
          python3 scripts/package_official_clips.py
          python3 scripts/package_rulebook.py
          python3 scripts/build_archive_site.py --output "${{ runner.temp }}/agent-nba-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/agent-nba-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
