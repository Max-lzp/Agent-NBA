name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'scripts/qa/check_timeline.mjs'
      - 'scripts/qa/check_local_replay.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate timeline data contract
        run: node scripts/qa/check_timeline.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
