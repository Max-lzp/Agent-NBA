<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视觉回放台</title>
  <style>
    :root {
      --ink: #14120e;
      --panel: #1d1a15;
      --line: #3a342a;
      --paper: #f3ecdf;
      --muted: #b3a790;
      --amber: #e2a122;
      --pass: #e2a122;
      --steal: #e25b45;
      --hou: #f4efe4;
      --dal: #6ea2e0;
      --ball: #ef6a2a;
      --unknown: #8d8678;
      --ref: #d6d0c8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); }
    body {
      display: flex;
      flex-direction: column;
      font-family: "Avenir Next Condensed", "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
      letter-spacing: 0.01em;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px 8px;
    }
    .engine-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 0 20px 10px;
      border-bottom: 1px solid var(--line);
    }
    .engine-bar .tag {
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.14em;
    }
    button.engine.active { background: var(--paper); color: var(--ink); border-color: var(--paper); }
    button.engine:disabled { opacity: 0.45; cursor: default; }
    .component {
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.5;
    }
    .component a { color: var(--amber); }
    .component .role { color: var(--paper); }
    h1 { margin: 0; font-weight: 600; font-size: 22px; letter-spacing: 0.04em; }
    h1 span { color: var(--muted); font-weight: 500; margin-left: 8px; font-size: 14px; }
    h1 .release {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .clips { display: flex; gap: 8px; }
    button, .clip {
      font: inherit;
      color: var(--paper);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      cursor: pointer;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    button:hover, .clip:hover { border-color: var(--amber); }
    .clip.active { background: var(--amber); color: #1a1408; border-color: var(--amber); }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      padding: 16px 20px 24px;
      flex: 1;
      min-height: 0;
    }
    .stage-wrap { display: flex; flex-direction: column; min-width: 0; }
    .stage { position: relative; background: #000; line-height: 0; }
    video { display: block; width: 100%; height: auto; max-height: calc(100vh - 280px); object-fit: contain; background: #000; }
    canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .banner {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 10px;
      background: rgba(20, 18, 14, 0.82);
      border-left: 4px solid var(--amber);
      font-size: 20px;
      letter-spacing: 0.08em;
      display: none;
    }
    .banner.steal { border-left-color: var(--steal); }
    .banner.show { display: block; }
    .hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: min(420px, 70%);
      padding: 8px 10px;
      background: rgba(20, 18, 14, 0.82);
      border-left: 4px solid var(--muted);
      font-size: 16px;
      letter-spacing: 0.06em;
      line-height: 1.35;
      display: none;
    }
    .hud.show { display: block; }
    .hud.HOU { border-left-color: var(--hou); }
    .hud.DAL { border-left-color: var(--dal); }
    .hud small { display: block; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
    .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 0 6px; }
    .time { font-family: "SF Mono", "Menlo", monospace; font-size: 13px; color: var(--muted); min-width: 220px; }
    .rate button.active { background: var(--paper); color: var(--ink); }
    input[type="range"] {
      width: 100%;
      accent-color: var(--amber);
    }
    .rail { position: relative; height: 36px; margin-top: 4px; }
    .rail input { position: absolute; inset: 8px 0 auto 0; width: 100%; }
    .ticks, .bands { position: absolute; inset: 0; pointer-events: none; }
    .bands { top: auto; height: 5px; bottom: 0; }
    .band { position: absolute; top: 0; height: 5px; opacity: 0.55; }
    .band.HOU { background: var(--hou); }
    .band.DAL { background: var(--dal); }
    .band.active { opacity: 1; }
    .tick {
      position: absolute;
      top: 0;
      width: 2px;
      height: 10px;
      transform: translateX(-1px);
      background: var(--muted);
    }
    .tick.pass { background: var(--pass); }
    .tick.receive { background: var(--paper); }
    .tick.interception, .tick.turnover { background: var(--steal); }
    .tick.shot, .tick.rebound { background: var(--ball); }
    .tick.screen_set, .tick.screen_use, .tick.dribble_handoff { background: #d6c27a; }
    aside {
      border-left: 1px solid var(--line);
      padding-left: 16px;
      overflow: auto;
      min-height: 0;
    }
    h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .event {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 6px;
    }
    .event, .poss-head { white-space: normal; align-items: start; }
    .poss-head {
      display: grid;
      grid-template-columns: 52px 1fr;
      gap: 8px;
      width: 100%;
      text-align: left;
      border-radius: 6px;
      padding: 8px;
      margin: 12px 0 4px;
    }
    .poss-head .when, .event .when { font-family: "SF Mono", Menlo, monospace; color: var(--amber); }
    .poss-head small, .event small { display: block; color: var(--muted); }
    .poss-head.active, .event.active { border-color: var(--amber); background: rgba(226, 161, 34, 0.1); }
    .poss-head.HOU .title { color: var(--hou); }
    .poss-head.DAL .title { color: var(--dal); }
    .event.low { opacity: 0.72; }
    .stream-note, .snapshot { margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
    .snapshot b { color: var(--paper); font-weight: 600; }
    .legend { margin-top: 18px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border: 2px solid currentColor; }
    .note { margin-top: 12px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>视觉回放台<span id="subtitle">先选组件，再看这一版准不准</span><span class="release" id="release">v1.4 · build 5</span></h1>
    <div class="clips" id="clips"></div>
  </header>
  <div class="engine-bar">
    <span class="tag">组件</span>
    <div class="clips" id="engines"></div>
  </div>
  <main>
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <video id="video" playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="banner" id="banner"></div>
        <div class="hud" id="hud"></div>
      </div>
      <div class="transport">
        <button id="play" type="button">播放</button>
        <button id="prev" type="button">上一检测帧</button>
        <button id="next" type="button">下一检测帧</button>
        <span class="rate">
          <button type="button" data-rate="0.5">0.5×</button>
          <button type="button" data-rate="1" class="active">1×</button>
        </span>
        <span class="time" id="time">—</span>
      </div>
      <div class="rail">
        <div class="bands" id="bands"></div>
        <div class="ticks" id="ticks"></div>
        <input id="scrub" type="range" min="0" max="1000" value="0" />
      </div>
    </div>
    <aside>
      <div class="component" id="component">正在读组件说明。</div>
      <p class="stream-note" id="streamNote"></p>
      <div class="snapshot" id="snapshot" hidden></div>
      <h2 id="eventsHeading">事件</h2>
      <div id="events"></div>
      <div class="legend">
        <div><span class="swatch" style="color:var(--hou)"></span>这一帧下摆是白球衣，火箭</div>
        <div><span class="swatch" style="color:var(--dal)"></span>这一帧下摆是深色球衣，独行侠</div>
        <div><span class="swatch" style="color:var(--unknown)"></span>这一帧颜色不稳定</div>
        <div><span class="swatch" style="color:var(--ref)"></span>裁判，虚线，不参与分队和持球</div>
        <div><span class="swatch" style="color:var(--ball);border-radius:50%"></span>球</div>
        <div><span class="swatch" style="color:var(--amber)"></span>持球。事件流快照里标成持球的人</div>
        <div><span class="swatch" style="color:var(--steal)"></span>对位，或这一拍失误的持球人</div>
      </div>
      <p class="note">画面上的框来自当前组件。右侧读结构化事件流：回合、双方、置信度、来源，以及快照里的持球、对位和协防。角色字样只在 basketball_analysis 的轨迹上对得上。框约 8.5 fps 刷新一次。空格播放，左右方向键跳检测帧。</p>
    </aside>
  </main>
  <script type="module">
    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const banner = document.getElementById("banner");
    const timeEl = document.getElementById("time");
    const scrub = document.getElementById("scrub");
    const ticks = document.getElementById("ticks");
    const bands = document.getElementById("bands");
    const eventsEl = document.getElementById("events");
    const eventsHeading = document.getElementById("eventsHeading");
    const streamNote = document.getElementById("streamNote");
    const snapshot = document.getElementById("snapshot");
    const hud = document.getElementById("hud");
    const playBtn = document.getElementById("play");

    // 改视觉回放台时：version 末位加一，build 加一，并改标题上的 release。
    const RELEASE = { version: "1.4", build: 5 };
    const TYPE = {
      pass: "传球", interception: "抢断", shot: "出手", rebound: "篮板",
      receive: "接球", turnover: "失误", screen_set: "设掩护", screen_use: "用掩护",
      dribble_handoff: "手递手", scoreboard_sync: "记分牌",
    };
    const ROLE = { ballhandler: "持球", on_ball_defender: "对位", help_defender: "协防", off_ball: "无球" };
    const ROLE_ORDER = ["ballhandler", "on_ball_defender", "help_defender", "off_ball"];
    const TEAM = { HOU: "火箭", DAL: "独行侠" };
    const ZONE = {
      restricted: "合理冲撞区", paint: "油漆区", midrange: "中距离",
      corner3_l: "左侧底角", corner3_r: "右侧底角",
      wing3_l: "左侧45°", wing3_r: "右侧45°", top3: "弧顶三分",
    };
    const DIST = { tight: "贴防", one_step: "一步", two_plus: "两步开外" };
    const CAL = { fresh: "标定新", stale: "标定旧", none: "未标定" };
    const SOURCE = { cv: "CV", vlm: "VLM", manual: "人工", rule: "规则", llm_arbitrated: "模型仲裁", fallback_class: "大类" };
    let doc = null;
    let stream = null;
    let flatEvents = [];
    let duration = 0;
    let scrubbing = false;
    let catalog = null;
    let engineId = "basketball_analysis";
    let clipId = null;
    let paintKey = "";

    function sampleIndex(t) {
      const rows = doc.timeline;
      let lo = 0;
      let hi = rows.length - 1;
      let ans = 0;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (rows[mid].t <= t + 0.001) {
          ans = mid;
          lo = mid + 1;
        } else {
          hi = mid - 1;
        }
      }
      return ans;
    }

    function activeEvents(t) {
      return (doc.events || []).filter((event) => Math.abs(event.t - t) <= 0.45);
    }

    function resizeCanvas() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    function drawBox(bbox, color, width, label, dashed) {
      const [x, y, w, h] = bbox;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.setLineDash(dashed || h > 700 ? [10, 8] : []);
      ctx.strokeRect(x, y, w, h);
      ctx.setLineDash([]);
      if (!label) return;
      ctx.font = "28px Avenir Next Condensed, PingFang SC, sans-serif";
      const pad = 6;
      const textW = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(12,10,8,0.78)";
      ctx.fillRect(x, Math.max(0, y - 34), textW + pad * 2, 32);
      ctx.fillStyle = color;
      ctx.fillText(label, x + pad, Math.max(24, y - 8));
    }

    function person(ref) {
      if (!ref) return "";
      const team = ref.team || "";
      const name = ref.name || "";
      const num = ref.number ? "#" + ref.number : "";
      if (name || num) return [team, name, num].filter(Boolean).join(" ");
      if (ref.track_id != null) return [team, "轨迹 " + ref.track_id].filter(Boolean).join(" ");
      return team || "未知";
    }

    function confText(event) {
      const pct = Math.round(Number(event.confidence || 0) * 100);
      const src = SOURCE[event.source] || event.source || "";
      return "置信 " + pct + "%" + (src ? " · " + src : "");
    }

    function geometryLine(geometry) {
      if (!geometry) return "";
      const parts = [];
      if (geometry.shot_zone) parts.push(ZONE[geometry.shot_zone] || geometry.shot_zone);
      if (geometry.def_dist_ft != null) parts.push("防守 " + Number(geometry.def_dist_ft).toFixed(1) + " 英尺");
      else if (geometry.def_dist_qual) parts.push(DIST[geometry.def_dist_qual] || geometry.def_dist_qual);
      if (geometry.nearest_defender) parts.push("最近防守 " + person(geometry.nearest_defender));
      if (geometry.x_ft != null && geometry.y_ft != null) {
        parts.push(Number(geometry.x_ft).toFixed(1) + ", " + Number(geometry.y_ft).toFixed(1) + " ft");
      }
      return parts.join(" · ");
    }

    function tacticsLine(poss) {
      return (poss.tactics || []).map((item) => {
        const name = item.label_zh || item.action || "";
        const pct = Math.round(Number(item.confidence || 0) * 100);
        const src = SOURCE[item.source] || item.source || "";
        return [name, pct + "%", src].filter(Boolean).join(" ");
      }).join(" · ");
    }

    function indexStream() {
      flatEvents = [];
      for (const poss of (stream && stream.possessions) || []) {
        for (const event of poss.events || []) flatEvents.push({ event, poss });
      }
    }

    function possessionAt(t) {
      const rows = (stream && stream.possessions) || [];
      const hit = rows.find((poss) => t + 0.001 >= poss.t_start && t <= poss.t_end + 0.001);
      if (hit) return hit;
      return rows.find((poss) => poss.t_start >= t && poss.t_start - t <= 0.5) || null;
    }

    function keyframeAt(t) {
      const poss = possessionAt(t);
      if (!poss) return null;
      let kf = null;
      for (const item of poss.keyframes || []) {
        if (item.t <= t + 0.05) kf = item;
      }
      return kf ? { poss, kf } : null;
    }

    function latestEvent(t) {
      let behind = null;
      let ahead = null;
      for (const row of flatEvents) {
        const dt = row.event.t - t;
        if (dt <= 0.15) behind = row;
        else if (dt <= 0.45) ahead = row;
        else break;
      }
      const behindGap = behind ? t - behind.event.t : Infinity;
      const aheadGap = ahead ? ahead.event.t - t : Infinity;
      const pick = aheadGap < behindGap ? ahead : behind;
      if (!pick || Math.min(behindGap, aheadGap) > 8) return null;
      return pick;
    }

    function placeTick(t, type) {
      const tick = document.createElement("div");
      tick.className = "tick " + (type || "");
      tick.style.left = (duration ? (t / duration) * 100 : 0) + "%";
      ticks.appendChild(tick);
    }

    function seekTo(t) {
      paintKey = "";
      video.currentTime = Math.max(0, t);
      draw();
    }

    function paintHud(poss, snap) {
      if (!poss) {
        hud.className = "hud";
        hud.textContent = "";
        return;
      }
      const team = TEAM[poss.offense_team] || poss.offense_team || "未知";
      hud.className = "hud show " + (poss.offense_team || "");
      hud.replaceChildren();
      const title = document.createElement("b");
      title.textContent = poss.possession_id + " · " + team + "进攻";
      const meta = document.createElement("small");
      const bits = [poss.t_start.toFixed(2) + "–" + poss.t_end.toFixed(2) + "s"];
      if (snap) {
        bits.push("快照 " + snap.kf.t.toFixed(2) + "s");
        bits.push(TYPE[snap.kf.why] || snap.kf.why || "");
        bits.push(CAL[snap.kf.calibration] || snap.kf.calibration || "");
      }
      meta.textContent = bits.filter(Boolean).join(" · ");
      hud.append(title, meta);
      const tactic = tacticsLine(poss);
      if (tactic) {
        const extra = document.createElement("small");
        extra.textContent = tactic;
        hud.append(extra);
      }
    }

    function paintSnapshot(poss, snap) {
      if (!stream) {
        snapshot.hidden = true;
        snapshot.replaceChildren();
        return;
      }
      snapshot.hidden = false;
      snapshot.replaceChildren();
      if (!snap) {
        snapshot.textContent = poss ? "这个回合还没有角色快照。" : "当前时间不在任何一个回合里。";
        return;
      }
      const head = document.createElement("div");
      const title = document.createElement("b");
      title.textContent = "快照 " + snap.kf.t.toFixed(2) + "s";
      head.append(title, document.createTextNode(" · " + (TYPE[snap.kf.why] || snap.kf.why || "") + " · " + (CAL[snap.kf.calibration] || snap.kf.calibration || "")));
      snapshot.append(head);
      const groups = new Map();
      for (const pos of snap.kf.positions || []) {
        const role = pos.role || "off_ball";
        if (!groups.has(role)) groups.set(role, []);
        let text = person(pos.player);
        if (pos.x_ft != null && pos.y_ft != null) text += " " + Number(pos.x_ft).toFixed(0) + "," + Number(pos.y_ft).toFixed(0);
        groups.get(role).push(text);
      }
      for (const role of ROLE_ORDER) {
        const names = groups.get(role);
        if (!names || !names.length) continue;
        const line = document.createElement("div");
        const label = document.createElement("b");
        label.textContent = ROLE[role] || role;
        line.append(label, document.createTextNode("　" + names.join("、")));
        snapshot.append(line);
      }
    }

    function markActive(poss, latest) {
      const possId = poss ? poss.possession_id : "";
      const eventId = latest ? latest.event.event_id : "";
      document.querySelectorAll(".band, .poss-head").forEach((node) => {
        node.classList.toggle("active", node.dataset.poss === possId);
      });
      document.querySelectorAll("#events .event").forEach((node) => {
        const on = node.dataset.event === eventId;
        node.classList.toggle("active", on);
        if (on) node.scrollIntoView({ block: "nearest" });
      });
    }

    function paintLive(t, poss, snap) {
      const latest = latestEvent(t);
      const key = [poss ? poss.possession_id : "", snap ? snap.kf.t : "", latest ? latest.event.event_id : ""].join("|");
      if (key === paintKey) return;
      paintKey = key;
      paintHud(poss, snap);
      paintSnapshot(poss, snap);
      markActive(poss, latest);
    }

    function draw() {
      if (!doc || !video.videoWidth) return;
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const t = video.currentTime || 0;
      const sample = doc.timeline[sampleIndex(t)];
      const events = stream ? [] : activeEvents(t);
      const eventTracks = new Set(events.map((event) => event.track_id));
      const poss = possessionAt(t);
      const snap = keyframeAt(t);
      const alignRoles = engineId === "basketball_analysis" && !!snap;
      const roleByTrack = new Map();
      if (alignRoles) {
        for (const pos of snap.kf.positions || []) {
          const id = pos.player && pos.player.track_id;
          if (id != null) roleByTrack.set(id, pos);
        }
      }
      const near = stream ? flatEvents.filter((row) => Math.abs(row.event.t - t) <= 0.45) : [];
      const actorTone = new Map();
      const nearTargets = new Set();
      for (const row of near) {
        const actorId = row.event.actor && row.event.actor.track_id;
        const targetId = row.event.target && row.event.target.track_id;
        if (actorId != null) actorTone.set(actorId, row.event.type === "turnover" ? "turnover" : actorTone.get(actorId) || "event");
        if (targetId != null) nearTargets.add(targetId);
      }
      let athletes = 0;
      let referees = 0;
      for (const player of sample.players) {
        if (player.role === "referee") {
          referees += 1;
          drawBox(player.bbox, "#d6d0c8", 2, "裁判", true);
          continue;
        }
        athletes += 1;
        const handler = player.track_id === sample.ball_handler_track;
        const eventHit = eventTracks.has(player.track_id);
        const streamed = roleByTrack.get(player.track_id);
        const teamColor = player.team === "HOU" ? "#f4efe4" : player.team === "DAL" ? "#6ea2e0" : "#8d8678";
        let color = teamColor;
        let width = 2;
        const tone = actorTone.get(player.track_id);
        if (alignRoles && tone) {
          color = tone === "turnover" ? "#e25b45" : "#e2a122";
          width = 5;
        } else if (alignRoles && nearTargets.has(player.track_id)) {
          width = 4;
        } else if (streamed && streamed.role === "ballhandler") {
          color = "#e2a122";
          width = 5;
        } else if (streamed && streamed.role === "on_ball_defender") {
          color = "#e25b45";
          width = 4;
        } else if (!alignRoles && (eventHit || handler)) {
          color = eventHit ? "#e25b45" : "#e2a122";
          width = 5;
        }
        const who = player.name
          ? player.name + (player.jersey ? " #" + player.jersey : "")
          : player.jersey
            ? (player.team || "?") + " #" + player.jersey
            : (player.team || "?") + " #" + player.track_id;
        let prefix = "";
        if (streamed && (streamed.role === "ballhandler" || streamed.role === "on_ball_defender")) {
          prefix = (ROLE[streamed.role] || streamed.role) + " ";
        }
        else if (!alignRoles && handler) prefix = "持球 ";
        drawBox(player.bbox, color, width, prefix + who);
      }
      if (sample.ball) {
        const [x, y, w, h] = sample.ball;
        ctx.beginPath();
        ctx.strokeStyle = "#ef6a2a";
        ctx.lineWidth = 3;
        ctx.arc(x + w / 2, y + h / 2, Math.max(w, h) / 2 + 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (near.length) {
        const text = near.map((row) => {
          const actor = person(row.event.actor);
          const target = person(row.event.target);
          const who = target ? actor + " → " + target : actor;
          return (TYPE[row.event.type] || row.event.type) + (who ? " " + who : "");
        }).join("  ·  ");
        banner.textContent = text;
        banner.className = "banner show" + (near.some((row) => row.event.type === "turnover" || row.event.type === "interception") ? " steal" : "");
      } else if (!stream && events.length) {
        const text = events.map((event) => TYPE[event.type] + " " + (event.actor || ("轨迹 " + event.track_id))).join("  ·  ");
        banner.textContent = text;
        banner.className = "banner show" + (events.some((event) => event.type === "interception") ? " steal" : "");
      } else {
        banner.className = "banner";
      }
      const shown = sample.t.toFixed(3);
      const lag = Math.max(0, t - sample.t);
      const possLabel = poss ? "  ·  " + poss.possession_id + " " + (TEAM[poss.offense_team] || poss.offense_team) : "";
      timeEl.textContent = t.toFixed(2) + "s  ·  检测帧 " + shown + "s  ·  滞后 " + lag.toFixed(2) + "s  ·  球员 " + athletes + "  ·  裁判 " + referees + possLabel;
      if (!scrubbing) scrub.value = String(duration ? Math.round((t / duration) * 1000) : 0);
      if (stream) paintLive(t, poss, snap);
    }

    function renderStreamEvents() {
      const meta = stream.meta || {};
      const when = (meta.created_at || "").replace("T", " ").slice(0, 16);
      eventsHeading.textContent = "事件流";
      streamNote.textContent = "事件流 v" + (stream.version || "?")
        + " · " + (meta.mode || "")
        + " · " + (stream.possessions || []).length + " 个回合 · " + flatEvents.length + " 个事件"
        + (when ? " · " + when + " UTC" : "")
        + (meta.notes ? " · " + meta.notes : "");
      for (const poss of stream.possessions || []) {
        const head = document.createElement("button");
        head.className = "poss-head " + (poss.offense_team || "");
        head.type = "button";
        head.dataset.poss = poss.possession_id;
        const whenEl = document.createElement("span");
        whenEl.className = "when";
        whenEl.textContent = poss.possession_id;
        const body = document.createElement("span");
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = (TEAM[poss.offense_team] || poss.offense_team || "未知") + "进攻";
        const sub = document.createElement("small");
        sub.textContent = poss.t_start.toFixed(2) + "–" + poss.t_end.toFixed(2) + "s · " + (poss.events || []).length + " 个事件";
        body.append(title, sub);
        const tactic = tacticsLine(poss);
        if (tactic) {
          const extra = document.createElement("small");
          extra.textContent = tactic;
          body.append(extra);
        }
        head.append(whenEl, body);
        head.addEventListener("click", () => seekTo(poss.t_start));
        eventsEl.appendChild(head);
        const band = document.createElement("div");
        band.className = "band " + (poss.offense_team || "");
        band.dataset.poss = poss.possession_id;
        const start = duration ? (poss.t_start / duration) * 100 : 0;
        const end = duration ? (poss.t_end / duration) * 100 : 0;
        band.style.left = start + "%";
        band.style.width = Math.max(0.4, end - start) + "%";
        bands.appendChild(band);
        for (const event of poss.events || []) {
          const button = document.createElement("button");
          button.className = "event" + ((event.confidence ?? 1) < 0.45 ? " low" : "");
          button.type = "button";
          button.dataset.event = event.event_id;
          const stamp = document.createElement("span");
          stamp.className = "when";
          stamp.textContent = event.t.toFixed(2) + "s";
          const detail = document.createElement("span");
          const label = document.createElement("span");
          label.textContent = TYPE[event.type] || event.type;
          const who = document.createElement("small");
          const actor = person(event.actor);
          const target = person(event.target);
          who.textContent = target ? actor + " → " + target : actor;
          const metaLine = document.createElement("small");
          const geo = geometryLine(event.geometry);
          metaLine.textContent = [event.event_id, confText(event), geo].filter(Boolean).join(" · ");
          detail.append(label, who, metaLine);
          button.append(stamp, detail);
          button.addEventListener("click", () => seekTo(event.t));
          eventsEl.appendChild(button);
          placeTick(event.t, event.type);
        }
      }
    }

    function renderEvents() {
      eventsEl.innerHTML = "";
      ticks.innerHTML = "";
      bands.innerHTML = "";
      paintKey = "";
      if (stream && (stream.possessions || []).length) {
        renderStreamEvents();
        return;
      }
      hud.className = "hud";
      snapshot.hidden = true;
      eventsHeading.textContent = "事件";
      streamNote.textContent = "这段还没有结构化事件流，下面仍是当前组件检出的事件。";
      for (const event of (doc && doc.events) || []) {
        const button = document.createElement("button");
        button.className = "event";
        button.type = "button";
        const who = event.actor || ("轨迹 " + event.track_id);
        button.innerHTML = `<span class="when">${event.t.toFixed(2)}s</span><span>${TYPE[event.type] || event.type}<small>${who}</small></span>`;
        button.addEventListener("click", () => seekTo(event.t));
        eventsEl.appendChild(button);
        placeTick(event.t, event.type);
      }
      if (!((doc && doc.events) || []).length) {
        eventsEl.textContent = doc ? "这个组件在这段里没有检出传球或抢断。" : "这个组件还没有这段的结果。";
      }
    }

    function currentEngine() {
      return (catalog.engines || []).find((engine) => engine.id === engineId) || null;
    }

    function resultUrl(id) {
      if (engineId === "basketball_analysis") return "data/" + id + ".json";
      return "data/" + id + "." + engineId + ".json";
    }

    function showComponent() {
      const engine = currentEngine();
      const fromDoc = (doc && doc.component) || {};
      const label = fromDoc.label || (engine && engine.label) || engineId;
      const repo = fromDoc.repo || (engine && engine.repo) || "";
      const license = fromDoc.license || (engine && engine.license) || "";
      const role = fromDoc.role || (engine && engine.role) || "";
      const note = fromDoc.note || (engine && engine.note) || "";
      const link = repo ? `<a href="${repo}" target="_blank" rel="noreferrer">${label}</a>` : label;
      document.getElementById("component").innerHTML =
        `<div class="role">${link}</div>` +
        `<div>${role}</div>` +
        `<div>许可 ${license}</div>` +
        `<div>${note}</div>`;
      document.getElementById("subtitle").textContent = "当前组件 " + label;
      document.getElementById("release").textContent = "v" + RELEASE.version + " · build " + RELEASE.build;
      document.title = "视觉回放台 v" + RELEASE.version + " build " + RELEASE.build;
    }

    function paintEngineButtons() {
      document.querySelectorAll(".engine").forEach((node) => {
        const engine = catalog.engines.find((item) => item.id === node.dataset.id);
        const readyMap = (engine && engine.ready) || {};
        const ready = clipId ? !!readyMap[clipId] : Object.values(readyMap).some(Boolean);
        const progress = clipId && engine && engine.progress ? engine.progress[clipId] : null;
        const extra = progress && progress.partial ? " · " + progress.frames + "帧" : "";
        node.dataset.ready = ready ? "1" : "0";
        node.classList.toggle("active", node.dataset.id === engineId);
        node.disabled = !ready;
        node.textContent = engine.label + (ready ? extra : "（还没跑）");
      });
    }

    async function loadClip(id, keepTime) {
      clipId = id;
      paintKey = "";
      const held = keepTime ? video.currentTime || 0 : 0;
      document.querySelectorAll(".clip").forEach((node) => node.classList.toggle("active", node.dataset.id === id));
      paintEngineButtons();
      const [response, streamResponse] = await Promise.all([
        fetch(resultUrl(id)),
        fetch("data/stream/" + id + ".json"),
      ]);
      stream = streamResponse.ok ? await streamResponse.json() : null;
      indexStream();
      if (!response.ok) {
        doc = null;
        showComponent();
        renderEvents();
        return;
      }
      doc = await response.json();
      const nextSrc = new URL("media/" + id + ".mp4", window.location.href).href;
      if (video.currentSrc !== nextSrc) {
        video.src = "media/" + id + ".mp4";
        await new Promise((resolve) => video.addEventListener("loadedmetadata", resolve, { once: true }));
      }
      duration = video.duration || doc.duration_sec || 0;
      scrub.max = "1000";
      if (keepTime) video.currentTime = Math.min(held, Math.max(0, duration - 0.05));
      showComponent();
      renderEvents();
      draw();
    }

    function step(dir) {
      if (!doc) return;
      const index = sampleIndex(video.currentTime || 0);
      const sample = doc.timeline[index];
      let next = index + dir;
      if (dir < 0 && video.currentTime - sample.t > 0.05) next = index;
      next = Math.min(doc.timeline.length - 1, Math.max(0, next));
      video.pause();
      playBtn.textContent = "播放";
      video.currentTime = doc.timeline[next].t;
    }

    playBtn.addEventListener("click", () => {
      if (video.paused) video.play();
      else video.pause();
    });
    video.addEventListener("play", () => { playBtn.textContent = "暂停"; });
    video.addEventListener("pause", () => { playBtn.textContent = "播放"; });
    document.getElementById("prev").addEventListener("click", () => step(-1));
    document.getElementById("next").addEventListener("click", () => step(1));
    document.querySelectorAll("[data-rate]").forEach((button) => {
      button.addEventListener("click", () => {
        video.playbackRate = Number(button.dataset.rate);
        document.querySelectorAll("[data-rate]").forEach((node) => node.classList.toggle("active", node === button));
      });
    });
    scrub.addEventListener("pointerdown", () => { scrubbing = true; });
    scrub.addEventListener("pointerup", () => { scrubbing = false; });
    scrub.addEventListener("input", () => {
      if (!duration) return;
      video.currentTime = (Number(scrub.value) / 1000) * duration;
    });
    video.addEventListener("timeupdate", draw);
    video.addEventListener("seeked", draw);
    window.addEventListener("resize", draw);
    window.addEventListener("keydown", (event) => {
      if (event.target.matches("input, button")) return;
      if (event.code === "Space") {
        event.preventDefault();
        playBtn.click();
      } else if (event.code === "ArrowLeft") {
        event.preventDefault();
        step(-1);
      } else if (event.code === "ArrowRight") {
        event.preventDefault();
        step(1);
      }
    });

    catalog = await fetch("data/catalog.json").then((response) => response.json());
    const engines = document.getElementById("engines");
    for (const engine of catalog.engines) {
      const button = document.createElement("button");
      button.className = "engine";
      button.type = "button";
      button.dataset.id = engine.id;
      button.addEventListener("click", () => {
        if (button.disabled || engine.id === engineId) return;
        engineId = engine.id;
        if (clipId) loadClip(clipId, true);
      });
      engines.appendChild(button);
    }
    const clips = document.getElementById("clips");
    for (const clip of catalog.clips) {
      const button = document.createElement("button");
      button.className = "clip";
      button.type = "button";
      button.dataset.id = clip.id;
      button.textContent = clip.label;
      button.disabled = !clip.video_ready;
      button.addEventListener("click", () => loadClip(clip.id, false));
      clips.appendChild(button);
    }
    paintEngineButtons();
    const first = catalog.clips.find((clip) => clip.video_ready);
    if (first) loadClip(first.id, false);
    let seenFrames = 0;
    setInterval(async () => {
      if (!clipId) return;
      const next = await fetch("data/catalog.json").then((response) => response.json());
      catalog = next;
      paintEngineButtons();
      const engine = currentEngine();
      const progress = engine && engine.progress ? engine.progress[clipId] : null;
      const frames = progress && progress.partial ? progress.frames : 0;
      if (engineId === "kimi_k3" && frames > seenFrames) {
        seenFrames = frames;
        loadClip(clipId, true);
      }
    }, 8000);
  </script>
</body>
</html>
